task_statement: |
  Formalize scalar practical slice sampling (stepping-out + shrinkage) with
  executable refinement and IR emission. Kernel theory exists at
  formal/Mcmc/Kernel/PracticalSlice.lean (trace semantics, shrinkage budget).
  A Reference stepping_out_slice_step! already exists from existing IR.

  The task is to add the executable refinement theorem connecting the existing
  IR program to the mathematical kernel, proving that the trace-based execution
  implements the slice sampling transition. This is hard because the stepping-out
  and shrinkage procedures involve variable-length loops with termination proofs.

