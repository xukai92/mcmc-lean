task_statement: |
  Optimize vector_gauss_legendre_hmc_step! in Optimized.jl. This sampler uses
  the Gauss-Legendre implicit integrator instead of standard leapfrog. The
  Optimized version already exists but the optimization requires understanding
  the implicit solver iteration pattern, which is structurally different from
  leapfrog-based samplers.

  This tests the workflow on a sampler that may require extending or adapting
  the optimization patterns beyond the standard leapfrog template.

