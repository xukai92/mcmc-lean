task_statement: |
  Optimize dense_pmala_step! in Optimized.jl. This is position-dependent MALA
  with a dense metric — the most complex MALA variant. The function involves
  metric-dependent drift, Christoffel correction terms, and an asymmetric
  proposal with full Hastings correction.

  Target optimizations: generic T<:AbstractFloat, workspace reuse for metric
  computations, cache metric derivatives across the forward/reverse evaluation,
  reduce allocation in the Christoffel term computation.

